[package]
name = "panchangam"
version = "0.2.1"
edition = "2024"
description = "High-precision Vedic Panchangam calculations using Swiss Ephemeris"
license = "MIT"
repository = "https://github.com/fusionstrings/panchangam"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.106"
js-sys = "0.3.83"
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"

# libc and libm were for internal C shims, potentially still needed for other reasons
libc = "0.2.180"
libm = "0.2.15"

swiss-eph = { version = "0.2.1", features = ["embedded-ephe"] }
serde_json = "1.0.149"

[workspace]
members = ["."]
